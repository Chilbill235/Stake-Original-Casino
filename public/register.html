<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <title>Create Account — Stake Originals</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-darker: #050a10;
      --bg-dark: #0a1424;
      --bg-card: rgba(15, 27, 45, 0.78);
      --bg-input: #0d1b2e;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-green: #00ff66;
      --accent-cyan: #00e5ff;
      --accent-gold: #ffd700;
      --accent-red: #ff3366;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-lg: 20px;
      --radius-md: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--font);
      background-color: var(--bg-darker);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Ambient Background Glows */
    .glow-orb {
      position: fixed; border-radius: 50%; filter: blur(100px);
      pointer-events: none; z-index: 0;
      animation: pulseGlow 10s ease-in-out infinite alternate;
    }
    .glow-orb-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,255,102,0.14) 0%, rgba(0,0,0,0) 70%);
      top: -100px; right: -100px;
    }
    .glow-orb-2 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,180,255,0.12) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px; left: -150px;
      animation-delay: -5s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      100% { transform: scale(1.15) translate(-20px, 20px); opacity: 1; }
    }

    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }

    .auth-wrap {
      position: relative; z-index: 2; width: 100%; max-width: 480px;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand { text-align: center; margin-bottom: 24px; }
    .brand a {
      text-decoration: none; color: inherit; display: inline-flex;
      align-items: center; gap: 12px; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.01em;
    }
    .brand-logo {
      display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center;
      border-radius: 14px; background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      font-size: 22px; box-shadow: 0 0 25px rgba(0, 255, 102, 0.4); animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .brand .highlight {
      background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 32px 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .card h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .card .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px; line-height: 1.5; }
    .card .subtitle a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; transition: var(--transition); }
    .card .subtitle a:hover { color: var(--accent-green); text-decoration: underline; }

    .field { margin-top: 18px; }
    .field label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);
      letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-wrap input, .input-wrap select {
      width: 100%; padding: 13px 42px 13px 44px; font-size: 0.95rem; color: var(--text-primary);
      background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      transition: var(--transition); font-family: var(--font); outline: none; -webkit-appearance: none; appearance: none;
    }
    .input-wrap select { cursor: pointer; }
    .input-wrap select option { background: #0a1424; color: #fff; }

    .input-wrap .icon {
      position: absolute; left: 14px; color: var(--text-muted); font-size: 18px;
      pointer-events: none; transition: var(--transition); display: flex; align-items: center; justify-content: center;
    }

    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:focus, .input-wrap select:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 4px rgba(0, 255, 102, 0.12), 0 0 16px rgba(0, 255, 102, 0.1);
      background: rgba(13, 27, 46, 0.9);
    }
    .input-wrap input:focus + .icon, .input-wrap input:focus ~ .icon { color: var(--accent-green); }

    .toggle-pw {
      position: absolute; right: 12px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 6px;
      transition: var(--transition); display: flex; align-items: center; justify-content: center;
    }
    .toggle-pw:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }

    .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

    /* Strength Meter */
    .pw-meter { margin-top: 8px; height: 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .pw-meter .fill { height: 100%; width: 0; border-radius: 4px; transition: width 0.3s ease, background-color 0.3s ease; }
    .pw-label { font-size: 0.72rem; margin-top: 6px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

    .row { display: flex; gap: 12px; margin-top: 0; }
    .row .field { flex: 1; }

    /* Checkbox */
    .checkbox {
      display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; font-size: 0.82rem;
      color: var(--text-secondary); line-height: 1.45; cursor: pointer; user-select: none;
    }
    .checkbox input { display: none; }
    .checkbox .custom-check {
      width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--border-color);
      background: var(--bg-input); display: flex; align-items: center; justify-content: center;
      transition: var(--transition); flex-shrink: 0; margin-top: 1px;
    }
    .checkbox input:checked + .custom-check {
      background: var(--accent-green); border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
    }
    .checkbox input:checked + .custom-check::after {
      content: ''; width: 4px; height: 8px; border: solid #000;
      border-width: 0 2px 2px 0; transform: rotate(45deg); margin-bottom: 2px;
    }
    .checkbox a { color: var(--accent-cyan); text-decoration: none; font-weight: 600; }
    .checkbox a:hover { text-decoration: underline; }

    /* Primary Submit Button */
    .btn {
      width: 100%; margin-top: 22px; padding: 14px 20px; font-size: 0.95rem; font-weight: 800;
      letter-spacing: 0.03em; border: none; border-radius: var(--radius-md); cursor: pointer;
      transition: var(--transition); color: #03070d;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      box-shadow: 0 6px 20px rgba(0, 255, 102, 0.25);
      display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: 0.5s;
    }
    .btn:hover::before { left: 100%; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 255, 102, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #000; border-radius: 50%; display: none; animation: spin 0.8s linear infinite;
    }
    .btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Secondary Button & Divider */
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 16px; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }

    .btn-quiet {
      width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color); border-radius: var(--radius-md);
      color: var(--text-secondary); font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .btn-quiet:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); border-color: rgba(255, 255, 255, 0.2); }

    /* Notifications */
    .error {
      font-size: 0.85rem; color: #ff4d6d; background: rgba(255, 77, 109, 0.08);
      border: 1px solid rgba(255, 77, 109, 0.25); padding: 12px; border-radius: 10px;
      margin-top: 16px; display: none; align-items: center; gap: 10px; animation: shake 0.4s ease-in-out;
    }
    .error.show { display: flex; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .notice {
      display: flex; gap: 12px; margin-top: 20px; padding: 14px;
      border-radius: var(--radius-md); background: rgba(255, 215, 0, 0.05);
      border: 1px solid rgba(255, 215, 0, 0.2); font-size: 0.80rem;
      color: #e6d9a0; line-height: 1.45;
    }
    .notice b { color: #fff; }

    .footer-links { text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--text-muted); line-height: 1.6; }
    .footer-links a { color: var(--text-secondary); text-decoration: none; transition: var(--transition); }
    .footer-links a:hover { color: var(--text-primary); }

    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .card { padding: 24px 18px; }
      .row { flex-direction: column; gap: 0; }
      .row .field { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>
  <div class="bg-grid"></div>

  <div class="auth-wrap">
    <div class="brand">
      <a href="/" aria-label="Stake Originals Home">
        <span class="brand-logo">⚡</span>
        <span>STAKE<span class="highlight">&nbsp;ORIGINALS</span></span>
      </a>
    </div>

    <main class="card">
      <h1>Create your account</h1>
      <p class="subtitle">Already have an account? <a href="/login">Sign in</a>.</p>

      <form id="reg-form" novalidate autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <div class="input-wrap">
            <input type="text" id="username" name="username" placeholder="3-20 characters" autocomplete="username" required />
            <span class="icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
          </div>
          <div class="hint">3–20 characters. Letters, numbers, and underscores.</div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            <span class="icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
            </span>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required />
            <span class="icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </span>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="pw-meter"><div class="fill" id="pwFill"></div></div>
          <div class="pw-label" id="pwLabel">Password strength</div>
        </div>

        <div class="row">
          <div class="field">
            <label for="birthdate">Birth Date</label>
            <div class="input-wrap">
              <input type="date" id="birthdate" name="birthdate" required />
              <span class="icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              </span>
            </div>
          </div>
          <div class="field">
            <label for="state">State</label>
            <div class="input-wrap">
              <select id="state" name="state">
                <option value="TX">Texas</option>
                <option value="FL">Florida</option>
                <option value="OH">Ohio</option>
                <option value="CO">Colorado</option>
                <option value="IL">Illinois</option>
                <option value="VA">Virginia</option>
                <option value="NC">North Carolina</option>
                <option value="MN">Minnesota</option>
                <option value="IA">Iowa</option>
                <option value="MA">Massachusetts</option>
                <option value="AZ">Arizona (Restricted)</option>
                <option value="CA">California (Restricted)</option>
                <option value="NY">New York (Restricted)</option>
              </select>
              <span class="icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </span>
            </div>
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="terms" />
          <span class="custom-check"></span>
          <span>I am 18 or older and I accept the <a href="/legal/terms.html" target="_blank">Terms of Service</a>, <a href="/legal/privacy.html" target="_blank">Privacy Policy</a>, and <a href="/legal/sweepstakes-rules.html" target="_blank">Sweepstakes Rules</a>.</span>
        </label>

        <div class="error" id="error" role="alert" aria-live="polite">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="errorMsg"></span>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span class="spinner"></span>
          <span class="label">CREATE ACCOUNT</span>
        </button>
      </form>

      <div class="divider">or</div>
      <button type="button" class="btn-quiet" id="guestBtn">Continue as Guest</button>

      <div class="notice">
        <span style="font-size:18px;">🎁</span>
        <div><b>Welcome Bonus.</b> New accounts start instantly with <b>10,000 Gold Coins</b> + <b>10 Free Stake Cash</b> upon setup.</div>
      </div>
    </main>

    <footer class="footer-links">
      <a href="/">↩ Back to Lobby</a><br />
      <a href="mailto:support@stakeoriginals.com">Need assistance? Contact support</a>
    </footer>
  </div>

  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(window.location.search);
      var token = localStorage.getItem('casino_token');
      if (token) { window.location.replace('/'); return; }

      var form = document.getElementById('reg-form');
      var errorEl = document.getElementById('error');
      var errorMsg = document.getElementById('errorMsg');
      var btn = document.getElementById('submitBtn');
      var guestBtn = document.getElementById('guestBtn');
      var userEl = document.getElementById('username');
      var emailEl = document.getElementById('email');
      var passEl = document.getElementById('password');
      var birthEl = document.getElementById('birthdate');
      var stateEl = document.getElementById('state');
      var termsEl = document.getElementById('terms');
      var pwFill = document.getElementById('pwFill');
      var pwLabel = document.getElementById('pwLabel');
      var toggle = document.getElementById('togglePw');
      var eyeIcon = document.getElementById('eyeIcon');

      var RESTRICTED = ['CA','CT','ID','IN','LA','ME','MI','MT','NV','NJ','NY','OK','TN','WA','AZ'];

      function showError(msg) {
        errorMsg.textContent = msg;
        errorEl.classList.add('show');
      }

      function hideError() {
        errorEl.classList.remove('show');
        errorMsg.textContent = '';
      }

      toggle.addEventListener('click', function () {
        var isPw = passEl.type === 'password';
        passEl.type = isPw ? 'text' : 'password';
        eyeIcon.innerHTML = isPw 
          ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        passEl.focus();
      });

      function scorePw(v) {
        var s = 0;
        if (v.length >= 8) s++;
        if (v.length >= 12) s++;
        if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
        if (/\d/.test(v)) s++;
        if (/[^A-Za-z0-9]/.test(v)) s++;
        return s;
      }

      passEl.addEventListener('input', function () {
        var v = passEl.value;
        var s = scorePw(v);
        var pct = [0, 20, 40, 60, 80, 100][s] || 0;
        var color = '#ff3366', label = 'Weak';
        if (s >= 2) { color = '#ffd700'; label = 'Fair'; }
        if (s >= 3) { color = '#00e5ff'; label = 'Good'; }
        if (s >= 4) { color = '#00ff66'; label = 'Strong'; }
        
        pwFill.style.width = (v ? Math.max(pct, 10) : 0) + '%';
        pwFill.style.backgroundColor = v ? color : 'transparent';
        pwLabel.textContent = v ? 'Strength: ' + label : 'Password strength';
        pwLabel.style.color = v ? color : 'var(--text-muted)';
      });

      var now = new Date();
      birthEl.max = now.toISOString().slice(0, 10);
      birthEl.min = (now.getFullYear() - 120) + '-01-01';

      [userEl, emailEl, passEl, birthEl].forEach(function (el) { el.addEventListener('input', hideError); });
      stateEl.addEventListener('change', hideError);
      termsEl.addEventListener('change', hideError);

      async function api(path, method, body) {
        var res = await fetch(path, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined
        });
        var text = await res.text();
        var data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (e) {}
        return { ok: res.ok, status: res.status, data: data };
      }

      function setLoading(l) {
        btn.classList.toggle('loading', l);
        btn.disabled = l;
        guestBtn.disabled = l;
        var label = btn.querySelector('.label');
        if (label) label.textContent = l ? 'CREATING...' : 'CREATE ACCOUNT';
      }

      window.addEventListener('pageshow', function (event) {
        if (!event.persisted) return;
        hideError();
        setLoading(false);
      });

      form.addEventListener('submit', async function (ev) {
        ev.preventDefault();
        hideError();

        var username = userEl.value.trim();
        var email = emailEl.value.trim();
        var password = passEl.value;
        var birthDate = birthEl.value;
        var state = stateEl.value;

        if (!username) { showError('Please choose a username.'); userEl.focus(); return; }
        if (username.length < 3 || username.length > 20) { showError('Username must be 3 to 20 characters.'); userEl.focus(); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { showError('Username can only contain letters, numbers, and underscores.'); userEl.focus(); return; }
        if (!email) { showError('Please enter your email address.'); emailEl.focus(); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); emailEl.focus(); return; }
        if (RESTRICTED.indexOf(state) !== -1) {
          showError('Registration is not available in ' + state + '. Please select an eligible state.');
          stateEl.focus(); return;
        }
        if (password.length < 8) { showError('Password must be at least 8 characters long.'); passEl.focus(); return; }
        if (scorePw(password) < 3) { showError('Please create a stronger password with mixed letters, numbers, or symbols.'); passEl.focus(); return; }
        if (!birthDate) { showError('Please select your birth date for verification.'); birthEl.focus(); return; }
        
        var birth = new Date(birthDate);
        var age = Date.now() - birth.getTime();
        if (birth > now) { showError('Birth date cannot be set in the future.'); birthEl.focus(); return; }
        if (age < 18 * 365.25 * 24 * 60 * 60 * 1000) { showError('You must be at least 18 years old to sign up.'); birthEl.focus(); return; }
        if (!termsEl.checked) { showError('Please accept the Terms & Conditions to complete registration.'); termsEl.focus(); return; }

        var refCode = params.get('ref') || localStorage.getItem('casino_referral') || '';
        var body = { username: username, email: email, password: password, birthDate: birthDate, state: state };
        if (refCode) body.ref = refCode;

        setLoading(true);
        try {
          var r = await api('/api/auth/register', 'POST', body);
          if (!r.ok) {
            setLoading(false);
            if (r.data && r.data.geo) {
              showError(r.data.error || 'Registration is unavailable in your location.');
            } else if (r.status === 409) {
              showError(r.data.error || 'That email or username is already in use.');
            } else {
              showError(r.data.error || 'Registration failed. Please try again.');
            }
            return;
          }
          localStorage.setItem('casino_token', r.data.token);
          localStorage.setItem('casino_username', (r.data.user && r.data.user.username) || username);
          localStorage.removeItem('casino_referral');
          
          var redirect = params.get('redirect');
          var target = '/';
          if (redirect && redirect.charAt(0) === '/' && !redirect.startsWith('//')) target = redirect;
          window.location.replace(target);
        } catch (e) {
          setLoading(false);
          showError('Unable to connect. Please check your internet connection.');
        }
      });

      guestBtn.addEventListener('click', async function () {
        hideError();
        setLoading(true);
        var refCode = params.get('ref');
        var body = refCode ? { ref: refCode } : {};
        try {
          var r = await api('/api/auth/guest', 'POST', body);
          if (r.ok && r.data.token) {
            localStorage.setItem('casino_token', r.data.token);
            if (r.data.user && r.data.user.username) localStorage.setItem('casino_username', r.data.user.username);
            window.location.replace('/');
            return;
          }
          if (r.data && r.data.geo) { showError(r.data.error || 'Guest access restricted in your region.'); setLoading(false); return; }
          showError(r.data.error || 'Could not create a guest session.');
        } catch (e) {
          showError('Unable to connect. Please check your internet connection.');
        }
        setLoading(false);
      });
    })();
  </script>
</body>
</html>
