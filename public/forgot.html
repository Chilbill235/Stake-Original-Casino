<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Reset Password — Stake Originals</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #050a0f;
      --bg-card: rgba(15, 25, 40, 0.75);
      --bg-input: rgba(11, 20, 34, 0.85);
      --border-color: rgba(42, 74, 107, 0.45);
      --border-focus: #00ff41;
      
      --accent-green: #00ff41;
      --accent-cyan: #00b4ff;
      --accent-green-glow: rgba(0, 255, 65, 0.35);
      --accent-cyan-glow: rgba(0, 180, 255, 0.25);
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-danger: #ff4d6d;
      
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-lg: 16px;
      --radius-md: 10px;
      --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(1000px 500px at 50% -10%, rgba(0, 255, 65, 0.12), transparent 70%),
        radial-gradient(800px 400px at 85% 90%, rgba(0, 180, 255, 0.08), transparent 60%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Outer Container */
    .auth-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
    }

    /* Subtle background grid pattern overlay */
    .auth-wrap::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      right: -50px;
      bottom: -50px;
      background: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: -1;
      pointer-events: none;
    }

    /* Brand Header */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand a {
      text-decoration: none;
      color: inherit;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    .brand-logo {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      color: #04120a;
      box-shadow: 0 0 25px var(--accent-green-glow);
      transition: transform var(--transition-fast);
    }

    .brand a:hover .brand-logo {
      transform: scale(1.05) rotate(-3deg);
    }

    .brand .highlight {
      color: var(--accent-green);
    }

    /* Main Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-green), var(--accent-cyan), transparent);
    }

    .card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card .subtitle {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* Form Fields */
    .field {
      margin-top: 20px;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 42px 14px 42px;
      font-size: 0.95rem;
      color: #fff;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      font-family: var(--font);
    }

    .input-wrap input::placeholder {
      color: var(--text-muted);
    }

    .input-wrap .icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      fill: none;
      transition: stroke var(--transition-fast);
      pointer-events: none;
    }

    .input-wrap .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      border-radius: 6px;
      transition: color var(--transition-fast);
    }

    .input-wrap .toggle-pw:hover {
      color: var(--text-primary);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.15);
      background: rgba(13, 26, 45, 0.95);
    }

    .input-wrap input:focus ~ .icon-left {
      stroke: var(--accent-green);
    }

    /* Password Strength Meter */
    .strength-meter {
      margin-top: 10px;
      display: none;
    }

    .strength-meter.active {
      display: block;
    }

    .strength-bar-bg {
      height: 4px;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .strength-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--text-danger);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .strength-rules {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .rule-item {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color var(--transition-fast);
    }

    .rule-item.valid {
      color: var(--accent-green);
    }

    .rule-item::before {
      content: '•';
      font-size: 1rem;
      line-height: 0;
    }

    .rule-item.valid::before {
      content: '✓';
      font-size: 0.75rem;
    }

    /* Action Button */
    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      color: #04120a;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-cyan));
      box-shadow: 0 6px 20px var(--accent-green-glow);
      font-family: var(--font);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(0, 255, 65, 0.45);
      filter: brightness(1.05);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: grayscale(0.2);
    }

    /* Alerts */
    .alert {
      display: none;
      align-items: flex-start;
      gap: 10px;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      line-height: 1.45;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.show {
      display: flex;
    }

    .alert-ok {
      background: rgba(0, 255, 65, 0.08);
      border: 1px solid rgba(0, 255, 65, 0.3);
      color: #b9f6c9;
    }

    .alert-error {
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.35);
      color: #ff9db8;
    }

    .alert-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      margin-top: 1px;
    }

    /* Footer */
    .foot {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
    }

    .foot a {
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color var(--transition-fast);
    }

    .foot a:hover {
      color: #fff;
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(4, 18, 10, 0.25);
      border-top-color: #04120a;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    .btn.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="auth-wrap">
    <!-- Brand Header -->
    <div class="brand">
      <a href="/" aria-label="Stake Originals Home">
        <span class="brand-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </span>
        <span>STAKE<span class="highlight">&nbsp;ORIGINALS</span></span>
      </a>
    </div>

    <!-- Auth Card -->
    <main class="card">
      <h1 id="form-title">Reset your password</h1>
      <p class="subtitle" id="intro">Enter your registered account email to receive a secure, single-use recovery link valid for 60 minutes.</p>

      <!-- Request Form (Email) -->
      <form id="req-form" novalidate aria-labelledby="form-title">
        <div class="field">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="alert alert-error" id="error" role="alert" aria-live="polite"></div>
        <div class="alert alert-ok" id="ok" role="status" aria-live="polite"></div>

        <button type="submit" class="btn" id="reqBtn">
          <span class="spinner"></span>
          <span class="label">SEND RESET LINK</span>
        </button>
      </form>

      <!-- Reset Form (New Password) -->
      <form id="reset-form" novalidate style="display:none;" aria-labelledby="form-title">
        <div class="field">
          <label for="np">New password</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
            <input type="password" id="np" name="np" placeholder="Enter new password" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="np" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <!-- Password Strength Indicators -->
          <div class="strength-meter" id="strengthMeter">
            <div class="strength-bar-bg"><div class="strength-bar-fill" id="strengthFill"></div></div>
            <div class="strength-rules">
              <span class="rule-item" id="rule-len">8+ characters</span>
              <span class="rule-item" id="rule-upper">Uppercase letter</span>
              <span class="rule-item" id="rule-lower">Lowercase letter</span>
              <span class="rule-item" id="rule-num">Number</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="np2">Confirm new password</label>
          <div class="input-wrap">
            <svg class="icon-left" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            <input type="password" id="np2" name="np2" placeholder="Re-enter password" autocomplete="new-password" required />
            <button type="button" class="toggle-pw" data-target="np2" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="alert alert-error" id="rerror" role="alert" aria-live="polite"></div>
        <div class="alert alert-ok" id="rok" role="status" aria-live="polite"></div>

        <button type="submit" class="btn" id="resetBtn">
          <span class="spinner"></span>
          <span class="label">UPDATE PASSWORD</span>
        </button>
      </form>
    </main>

    <!-- Footer -->
    <footer class="foot">
      <a href="/login">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back to Sign In
      </a>
    </footer>
  </div>

  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var urlToken = params.get('token') || '';
    
    var reqForm = document.getElementById('req-form');
    var resetForm = document.getElementById('reset-form');
    var errorEl = document.getElementById('error');
    var okEl = document.getElementById('ok');
    var rerrorEl = document.getElementById('rerror');
    var rokEl = document.getElementById('rok');
    var npInput = document.getElementById('np');

    // UI State Helpers
    function showAlert(el, msg) {
      el.textContent = msg;
      el.classList.add('show');
    }

    function hideAlert(el) {
      el.classList.remove('show');
      el.textContent = '';
    }

    function setLoading(btn, isLoading, defaultText) {
      btn.disabled = isLoading;
      if (isLoading) {
        btn.classList.add('loading');
        btn.querySelector('.label').textContent = 'PROCESSING...';
      } else {
        btn.classList.remove('loading');
        btn.querySelector('.label').textContent = defaultText;
      }
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Password Visibility Toggles
    document.querySelectorAll('.toggle-pw').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var targetId = btn.getAttribute('data-target');
        var input = document.getElementById(targetId);
        var isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        btn.style.color = isPw ? 'var(--accent-green)' : 'var(--text-muted)';
      });
    });

    // Password Strength & Requirement Validation
    var rules = {
      len: function(v) { return v.length >= 8; },
      upper: function(v) { return /[A-Z]/.test(v); },
      lower: function(v) { return /[a-z]/.test(v); },
      num: function(v) { return /\d/.test(v); }
    };

    if (npInput) {
      npInput.addEventListener('focus', function () {
        document.getElementById('strengthMeter').classList.add('active');
      });

      npInput.addEventListener('input', function () {
        var val = npInput.value;
        var passedCount = 0;

        for (var key in rules) {
          var isValid = rules[key](val);
          var el = document.getElementById('rule-' + key);
          if (isValid) {
            el.classList.add('valid');
            passedCount++;
          } else {
            el.classList.remove('valid');
          }
        }

        var fill = document.getElementById('strengthFill');
        var pct = (passedCount / 4) * 100;
        fill.style.width = pct + '%';

        if (passedCount <= 1) {
          fill.style.backgroundColor = 'var(--text-danger)';
        } else if (passedCount <= 3) {
          fill.style.backgroundColor = 'var(--accent-cyan)';
        } else {
          fill.style.backgroundColor = 'var(--accent-green)';
        }
      });
    }

    // View Routing
    if (urlToken) {
      document.getElementById('form-title').textContent = 'Set new password';
      document.getElementById('intro').textContent = 'Please choose a strong, unique password for your account.';
      reqForm.style.display = 'none';
      resetForm.style.display = 'block';
    }

    // Submit Handler: Request Password Reset Link
    reqForm.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      hideAlert(errorEl); 
      hideAlert(okEl);
      
      var email = document.getElementById('email').value.trim();
      
      if (!email) { 
        showAlert(errorEl, 'Please enter your account email.'); 
        return; 
      }
      
      if (!isValidEmail(email)) {
        showAlert(errorEl, 'Please enter a valid email address.');
        return;
      }

      var btn = document.getElementById('reqBtn');
      setLoading(btn, true, 'SEND RESET LINK');

      try {
        var res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        
        var data = {};
        try { data = await res.json(); } catch (e) {}
        
        setLoading(btn, false, 'SEND RESET LINK');

        if (res.ok) {
          showAlert(okEl, data.message || 'If an account exists, a single-use password reset link was sent.');
          document.getElementById('email').value = '';
          
          // Development fallback check without loop vulnerability
          if (data.resetToken && window.location.hostname === 'localhost') {
            setTimeout(function () {
              window.location.href = '/forgot-password?token=' + encodeURIComponent(data.resetToken);
            }, 1200);
          }
        } else {
          showAlert(errorEl, data.error || 'Unable to complete request. Please try again.');
        }
      } catch (e) {
        setLoading(btn, false, 'SEND RESET LINK');
        showAlert(errorEl, 'Network error. Please check your connection and retry.');
      }
    });

    // Submit Handler: Reset Password
    resetForm.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      hideAlert(rerrorEl); 
      hideAlert(rokEl);

      var np = document.getElementById('np').value;
      var np2 = document.getElementById('np2').value;

      var allRulesPassed = rules.len(np) && rules.upper(np) && rules.lower(np) && rules.num(np);

      if (!np) { 
        showAlert(rerrorEl, 'Please enter your new password.'); 
        return; 
      }
      
      if (!allRulesPassed) { 
        showAlert(rerrorEl, 'Password does not meet all safety requirements.'); 
        return; 
      }
      
      if (np !== np2) { 
        showAlert(rerrorEl, 'Passwords do not match.'); 
        return; 
      }

      var btn = document.getElementById('resetBtn');
      setLoading(btn, true, 'UPDATE PASSWORD');

      try {
        var res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: urlToken, newPassword: np })
        });

        var data = {};
        try { data = await res.json(); } catch (e) {}

        setLoading(btn, false, 'UPDATE PASSWORD');

        if (res.ok) {
          showAlert(rokEl, 'Password successfully updated! Redirecting to sign in...');
          setTimeout(function () { 
            window.location.href = '/login'; 
          }, 1800);
        } else {
          showAlert(rerrorEl, data.error || 'This reset link is invalid or has expired.');
        }
      } catch (e) {
        setLoading(btn, false, 'UPDATE PASSWORD');
        showAlert(rerrorEl, 'Network error. Please check your connection and retry.');
      }
    });
  })();
  </script>
</body>
</html>
